style="color: var(--muted); margin-bottom: 1.5rem;">Mari berdiskusi tentang teknologi, peluang kolaborasi, atau sekadar bertukar sapa. Anda dapat menemukan saya melalui platform di bawah ini.</p>
                <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">
                    <a href="mailto:hello@example.com" class="ext-link"><i class="fa-solid fa-envelope"></i> Email</a>
                    <a href="https://github.com/" target="_blank" class="ext-link"><i class="fa-brands fa-github"></i> GitHub</a>
                    <a href="https://linkedin.com/" target="_blank" class="ext-link"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
                </div>
            </div>
        </div>
    </main>

    <!-- STATUS BAR (GLASS BOTTOM DOCK) -->
    <div id="status-bar">
        <div class="status-left">
            <span class="status-path" id="status-path"><i class="fa-solid fa-folder-open"></i> ~/portfolio/about</span>
            <span class="status-encoding hide-mobile">UTF-8</span>
            <span class="hide-mobile">HTML5</span>
        </div>
        <div class="status-right">
            <div class="theme-switcher">
                <div class="theme-btn" style="background-color: #090a0f;" onclick="setTheme('dark')" title="Dark Mode"></div>
                <div class="theme-btn" style="background-color: #140404;" onclick="setTheme('maroon')" title="Maroon Mode"></div>
                <div class="theme-btn" style="background-color: #070210;" onclick="setTheme('cyberpunk')" title="Cyberpunk Mode"></div>
                <div class="theme-btn" style="background-color: #f8fafc; border: 1px solid #ccc;" onclick="setTheme('light')" title="Light Mode"></div>
            </div>
            <span class="hide-mobile"><i class="fa-solid fa-code-branch"></i> main</span>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // --- NAVIGATION & PAGE ROUTING ---
        function navigate(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // Show target page
            const targetPage = document.getElementById(pageId + '-page');
            if (targetPage) {
                targetPage.classList.add('active');
            }

            // Update Navigation Links
            document.querySelectorAll('nav a').forEach(link => {
                link.classList.remove('active');
            });
            const activeNav = document.getElementById('nav-' + pageId);
            if (activeNav) {
                activeNav.classList.add('active');
            }

            // Update Status Bar Path
            const statusPath = document.getElementById('status-path');
            if (statusPath) {
                statusPath.innerHTML = `<i class="fa-solid fa-folder-open"></i> ~/portfolio/${pageId}`;
            }

            // Close Mobile Menu if open
            const navBar = document.getElementById('navbar');
            const hamburger = document.getElementById('hamburger-btn');
            if (navBar.classList.contains('show')) {
                navBar.classList.remove('show');
                hamburger.classList.remove('active');
            }
        }

        // --- THEME ENGINE ---
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('hendika-theme', themeName);
        }

        // --- COMMAND PALETTE (CTRL/CMD + K) ---
        const cmdPaletteOverlay = document.getElementById('cmd-palette-overlay');
        const cmdSearch = document.getElementById('cmd-search');
        
        document.addEventListener('keydown', (e) => {
            // Toggle with Ctrl+K or Cmd+K
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                toggleCmdPalette();
            }
            // Close with Escape
            if (e.key === 'Escape' && cmdPaletteOverlay.classList.contains('active')) {
                toggleCmdPalette();
            }
        });

        function toggleCmdPalette() {
            cmdPaletteOverlay.classList.toggle('active');
            if (cmdPaletteOverlay.classList.contains('active')) {
                cmdSearch.focus();
                cmdSearch.value = '';
            }
        }

        // Handle Command Palette Clicks
        document.querySelectorAll('.cmd-list li').forEach(item => {
            item.addEventListener('click', () => {
                const target = item.getAttribute('data-target');
                const action = item.getAttribute('data-action');
                
                if (target) {
                    navigate(target);
                } else if (action === 'download') {
                    alert('Download resume triggered! (Add actual link here)');
                }
                
                toggleCmdPalette();
            });
        });

        // --- MOBILE HAMBURGER MENU ---
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const navBar = document.getElementById('navbar');
        
        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('active');
            navBar.classList.toggle('show');
        });

        // --- SCRAMBLE TEXT EFFECT (CYBERPUNK GLITCH FEEL) ---
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        document.querySelectorAll('.scramble-text').forEach(el => {
            el.addEventListener('mouseover', event => {
                let iterations = 0;
                const originalText = event.target.dataset.value;
                
                const interval = setInterval(() => {
                    event.target.innerText = originalText.split("")
                        .map((letter, index) => {
                            if(index < iterations || letter === " ") {
                                return originalText[index];
                            }
                            return letters[Math.floor(Math.random() * 26)];
                        })
                        .join("");
                    
                    if(iterations >= originalText.length) {
                        clearInterval(interval);
                    }
                    iterations += 1 / 3;
                }, 30);
            });
        });

        // --- BASIC TERMINAL LOGIC (MOCKUP) ---
        const cmdInput = document.getElementById('cmd-input');
        const termOutput = document.getElementById('output');
        
        if (cmdInput) {
            cmdInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const val = this.value.trim().toLowerCase();
                    const promptText = document.getElementById('term-prompt').innerText;
                    
                    // Echo the command
                    termOutput.innerHTML += `<div>${promptText} ${this.value}</div>`;
                    
                    // Process command
                    if (val === 'clear') {
                        termOutput.innerHTML = '';
                    } else if (val === 'help') {
                        termOutput.innerHTML += `<div style="color: var(--muted); margin: 5px 0;">Available commands:<br>- <b>about</b>: Read about me<br>- <b>projects</b>: View projects<br>- <b>clear</b>: Clear terminal<br>- <b>date</b>: Current system date</div>`;
                    } else if (val === 'about') {
                        navigate('about');
                        termOutput.innerHTML += `<div style="color: var(--accent);">Navigating to /about...</div>`;
                    } else if (val === 'projects') {
                        navigate('projects');
                        termOutput.innerHTML += `<div style="color: var(--accent);">Navigating to /projects...</div>`;
                    } else if (val === 'date') {
                        termOutput.innerHTML += `<div>${new Date().toString()}</div>`;
                    } else if (val !== '') {
                        termOutput.innerHTML += `<div style="color: #ff4d4d;">Command not found: ${val}. Type 'help' for available commands.</div>`;
                    }
                    
                    this.value = '';
                    // Scroll to bottom
                    document.getElementById('terminal-body').scrollTop = document.getElementById('terminal-body').scrollHeight;
                }
            });
        }
    </script>
</body>
</html>
